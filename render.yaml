services:
  - type: web
    name: insta-reply-bot
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python backend/main.py"
    envVars:
      - key: INSTAGRAM_USERNAME
        sync: false
      - key: INSTAGRAM_PASSWORD
        sync: false
      - key: POLL_INTERVAL
        value: "45"
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_FILE
        value: "session.json"
      - key: SESSION_DATA
        sync: false
